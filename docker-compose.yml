services:

  neo4j:
    image: neo4j:5.26-community
    container_name: kg-rag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kg-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kgrag
      POSTGRES_USER: kgrag
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
